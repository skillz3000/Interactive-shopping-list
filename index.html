
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Shopping List</h1>

    <p>Keep track of the things you need to buy!</p>

    <input type="text" id="itemInput" placeholder="Enter an item">

    <input type="number" id="priceInput" placeholder="Enter price" min="0" step="0.01">

    <button id="addButton">Add Item</button>

    <ul id="shoppingList"></ul>

    <p>Total cost: KSh <span id="totalCost">0.00</span></p>

    <button id="clearButton">Clear List</button>

    <script src="script.js"></script>
</body>
</html>
